// Mute Toggle (Mouse 4)
alias "mute_toggle" "mute_on"
alias "mute_on" "voice_modenable 0; alias mute_toggle mute_off"
alias "mute_off" "voice_modenable 1; alias mute_toggle mute_on"
bind "mouse4" "mute_toggle"
bind "mouse5" "player_ping"

// Modifikátor SPACE (Při stisku přepne instruktora. Při držení: Mouse5 = zzměna ruky, Mouse4 = nákup granátů, F4 = disconnect, F5 = quit)
